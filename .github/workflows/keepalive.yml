name: Keep Scheduled Workflows Active

on:
  schedule:
    # Weekly check. It commits only when the repository has been inactive for 42+ days.
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Check repository activity
        id: activity
        shell: bash
        run: |
          set -euo pipefail
          now="$(date -u +%s)"
          last_commit="$(git log -1 --format=%ct)"
          age_days="$(( (now - last_commit) / 86400 ))"
          echo "age_days=$age_days"
          echo "age_days=$age_days" >> "$GITHUB_OUTPUT"
          if [ "$age_days" -ge 42 ]; then
            echo "needs_heartbeat=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_heartbeat=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create heartbeat commit only when needed
        if: steps.activity.outputs.needs_heartbeat == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github
          printf 'Last automated repository heartbeat: %s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > .github/keepalive.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt
          git commit -m "chore: keep scheduled workflows active [skip ci]"
          git push origin HEAD:main
