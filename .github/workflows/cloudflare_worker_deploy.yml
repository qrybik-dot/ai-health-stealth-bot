name: Cloudflare Worker Deploy

on:
  push:
    branches: [main]
    paths:
      - "cloudflare/**"
      - ".github/workflows/push.yml"
      - ".github/workflows/cloudflare_worker_deploy.yml"
  workflow_dispatch:
    inputs:
      operation:
        description: "Worker deploy operation"
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - deploy

jobs:
  cloudflare-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Workflow context (safe)
        run: |
          echo "event=${{ github.event_name }}"
          echo "ref=${{ github.ref }}"
          echo "operation=${{ inputs.operation }}"

      - name: Secrets preflight (safe)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "${name}=missing"
              missing=1
            else
              echo "${name}=present"
            fi
          done
          if { [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.operation }}" = "deploy" ]; } && [ "$missing" -ne 0 ]; then
            echo "deploy blocked: Cloudflare secrets missing"
            exit 1
          fi

      - name: Wrangler dry run
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler@4.92.0 deploy --dry-run

      - name: Confirm dispatch token is configured (names only)
        if: github.event_name == 'push' || inputs.operation == 'deploy'
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler@4.92.0 secret list --format json | python -c '
          import json, sys
          names = {item.get("name") for item in json.load(sys.stdin)}
          if "GITHUB_DISPATCH_TOKEN" not in names:
              print("Worker GITHUB_DISPATCH_TOKEN=missing. Deployment blocked; existing Worker untouched.")
              sys.exit(1)
          print("Worker GITHUB_DISPATCH_TOKEN=present (value not read)")
          '

      - name: Deploy Worker
        if: github.event_name == 'push' || inputs.operation == 'deploy'
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler@4.92.0 deploy
