name: CI

on:
  pull_request:
    paths:
      - "**.py"
      - "cloudflare/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python unit tests
        env:
          CI: "0"
        run: python -m unittest discover -s tests

      - name: Cloudflare Worker syntax
        run: node --check cloudflare/telegram-webhook-worker.js

      - name: Cloudflare Worker helper tests
        run: node tests/worker_helpers_ci.mjs


      - name: Recover missing Garmin days 2026-06-10 and 2026-06-11
        if: github.head_ref == 'ops/recover-garmin-june-10-11-20260929'
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GARMIN_TOKENSTORE: ${{ secrets.GARMIN_TOKENSTORE }}
          GARMIN_TOKENSTORE_PATH: ${{ secrets.GARMIN_TOKENSTORE_PATH }}
          GARMIN_PASSWORD_FALLBACK: "0"
          CACHE_GIST_ID: ${{ secrets.CACHE_GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/recover_exact_garmin_days.py 2026-06-10 2026-06-11
