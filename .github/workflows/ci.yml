name: CI

on:
  pull_request:
    paths:
      - "**.py"
      - "cloudflare/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/**"

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python unit tests
        env:
          CI: "0"
        run: python -m unittest discover -s tests

      - name: Cloudflare Worker syntax
        run: node --check cloudflare/telegram-webhook-worker.js

      - name: Cloudflare Worker helper tests
        run: node tests/worker_helpers_ci.mjs


      - name: Build and verify secondary Garmin archive
        if: github.head_ref == 'ops/complete-firestore-migration-20260928'
        env:
          CACHE_GIST_ID: ${{ secrets.CACHE_GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "=== ARCHIVE DRY RUN ==="
          python scripts/gist_archive.py --dry-run
          echo "=== ARCHIVE SYNC ALL ==="
          python scripts/gist_archive.py --sync-all
          echo "=== ARCHIVE VERIFY ==="
          python scripts/gist_archive.py --verify
