name: CI

on:
  pull_request:
    paths:
      - "**.py"
      - "cloudflare/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/**"

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python unit tests
        env:
          CI: "0"
        run: python -m unittest discover -s tests

      - name: Cloudflare Worker syntax
        run: node --check cloudflare/telegram-webhook-worker.js

      - name: Cloudflare Worker helper tests
        run: node tests/worker_helpers_ci.mjs


      - name: Authenticate to Google Cloud for migration gate
        if: github.head_ref == 'ops/complete-firestore-migration-20260928'
        uses: google-github-actions/auth@v3
        with:
          project_id: coach-potato-garmin-20260927
          workload_identity_provider: projects/60636748183/locations/global/workloadIdentityPools/github-actions/providers/coach-potato
          service_account: coach-potato-garmin@coach-potato-garmin-20260927.iam.gserviceaccount.com

      - name: Garmin Firestore archive dry-run, migrate, verify
        if: github.head_ref == 'ops/complete-firestore-migration-20260928'
        env:
          CACHE_GIST_ID: ${{ secrets.CACHE_GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIRESTORE_PROJECT_ID: coach-potato-garmin-20260927
          DATA_OWNER_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          echo "=== DRY RUN ==="
          python scripts/migrate_cache_to_firestore.py --dry-run
          echo "=== MIGRATE ==="
          python scripts/migrate_cache_to_firestore.py
          echo "=== VERIFY ==="
          python scripts/migrate_cache_to_firestore.py --verify-only
