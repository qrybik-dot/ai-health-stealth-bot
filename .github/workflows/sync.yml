name: Sync Garmin Cache

on:
  schedule:
    - cron: "0 */3 * * *"   # каждые 3 часа по UTC
  workflow_dispatch:
  pull_request:
    paths:
      - "**.py"
      - "cloudflare/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/sync.yml"

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python unit tests
        env:
          CI: "0"
        run: python -m unittest discover -s tests

      - name: Cloudflare Worker syntax
        run: node --check cloudflare/telegram-webhook-worker.js

      - name: Cloudflare Worker helper tests
        run: node tests/worker_helpers_ci.mjs

      - name: D1 archive read-only capability probe
        if: github.head_ref == 'ops/d1-archive-probe-20260927'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "0c6d1b47eb7fa09887d0ecb17ccaf7e1"
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN=missing"
            exit 1
          fi
          echo "CLOUDFLARE_API_TOKEN=present"
          http_code=$(curl -sS -o /tmp/d1-list.json -w "%{http_code}"             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database?per_page=10")
          echo "d1_list_http=$http_code"
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("/tmp/d1-list.json").read_text())
          print(f"d1_api_success={bool(payload.get('success'))}")
          print(f"d1_database_count_returned={len(payload.get('result') or [])}")
          if not payload.get("success"):
              errors = payload.get("errors") or []
              print("d1_error_codes=" + ",".join(str(e.get("code", "")) for e in errors[:5]))
              raise SystemExit(1)
          PY

  sync:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Workflow context (safe)
        run: |
          echo "event=${{ github.event_name }}"
          echo "ref=${{ github.ref }}"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Preflight env check (safe)
        env:
          CACHE_GIST_ID: ${{ secrets.CACHE_GIST_ID }}
          GARMIN_TOKENSTORE: ${{ secrets.GARMIN_TOKENSTORE }}
        run: |
          if [ -z "$CACHE_GIST_ID" ]; then
            echo "CACHE_GIST_ID=missing"
          else
            echo "CACHE_GIST_ID=present"
          fi
          if [ -z "$GARMIN_TOKENSTORE" ]; then
            echo "GARMIN_TOKENSTORE=missing"
            exit 1
          else
            echo "GARMIN_TOKENSTORE=present"
          fi

      - name: Run sync
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GARMIN_TOKENSTORE: ${{ secrets.GARMIN_TOKENSTORE }}
          GARMIN_TOKENSTORE_PATH: ${{ secrets.GARMIN_TOKENSTORE_PATH }}
          GARMIN_PASSWORD_FALLBACK: "0"
          CACHE_GIST_ID: ${{ secrets.CACHE_GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python main.py sync

      - name: Validate recovered cache
        env:
          CACHE_GIST_ID: ${{ secrets.CACHE_GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python main.py cache-self-check --require-today --require-usable-today

      - name: Upload cache.json to Gist
        env:
          CACHE_GIST_ID: ${{ secrets.CACHE_GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/gist_upload.py
